<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">QC Print Agent</title>
  <desc id="description">A blue and violet banner representing reliable label-printing operations from a connected warehouse workstation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A3D"/>
      <stop offset="0.55" stop-color="#123C7A"/>
      <stop offset="1" stop-color="#5936B5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D8C5"/>
      <stop offset="1" stop-color="#79A7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020819" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="560" fill="url(#background)"/>
  <circle cx="1400" cy="64" r="260" fill="#76B9FF" opacity="0.09"/>
  <circle cx="130" cy="590" r="310" fill="#38D8C5" opacity="0.08"/>
  <path d="M0 438C270 315 445 538 730 415S1220 290 1600 410V560H0Z" fill="#020B21" opacity="0.24"/>
  <g transform="translate(1050 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="300" rx="26" fill="#F7FAFF"/>
    <rect x="28" y="28" width="304" height="42" rx="12" fill="#DCE9FF"/>
    <circle cx="54" cy="49" r="8" fill="#39D8C5"/>
    <rect x="76" y="42" width="130" height="14" rx="7" fill="#27589D" opacity="0.8"/>
    <rect x="28" y="96" width="304" height="118" rx="15" fill="#102F61"/>
    <path d="M58 174h53v-48h47v48h52v-75h47v75h45" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="240" width="148" height="30" rx="15" fill="#E6EEFC"/>
    <rect x="197" y="240" width="135" height="30" rx="15" fill="#39D8C5"/>
  </g>
  <g transform="translate(108 142)">
    <rect x="0" y="0" width="186" height="38" rx="19" fill="#FFFFFF" opacity="0.13"/>
    <circle cx="23" cy="19" r="7" fill="#39D8C5"/>
    <text x="42" y="25" fill="#E9F2FF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">WAREHOUSE CONNECTOR</text>
    <text x="0" y="118" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">QC Print Agent</text>
    <text x="0" y="172" fill="#BED4FF" font-family="Arial, Helvetica, sans-serif" font-size="29">Reliable label delivery from cloud workflows</text>
    <text x="0" y="212" fill="#BED4FF" font-family="Arial, Helvetica, sans-serif" font-size="29">to on-premise ZPL printers.</text>
    <rect x="0" y="258" width="412" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="318" fill="#E9F2FF" font-family="Arial, Helvetica, sans-serif" font-size="19">Pair · Poll · Print · Confirm · Trace</text>
  </g>
