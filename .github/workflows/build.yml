name: Build Connector Installers

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - Installer-Implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # Remove dist folder to avoid "not empty" error
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          python -m PyInstaller print_agent.spec

      - name: Verify bundled Tcl/Tk files
        run: |
          echo "=== Checking dist folder structure ==="
          dir dist\qc-print-agent
          echo ""
          echo "=== Checking for _internal folder ==="
          dir dist\qc-print-agent\_internal | Select-Object -First 20
          echo ""
          echo "=== Checking for Tcl/Tk data folders ==="
          dir dist\qc-print-agent\_internal\_tcl_data 2>nul || echo "No _tcl_data folder"
          dir dist\qc-print-agent\_internal\_tk_data 2>nul || echo "No _tk_data folder"
          echo ""
          echo "=== Checking for Tcl/Tk DLLs ==="
          dir dist\qc-print-agent\_internal\tcl*.dll 2>nul || echo "No tcl DLLs"
          dir dist\qc-print-agent\_internal\tk*.dll 2>nul || echo "No tk DLLs"
          echo ""
          echo "=== Build complete ==="

      - name: Generate bootstrap config template
        env:
          PRINT_AGENT_CALLBACK_URL_SECRET: ${{ secrets.PRINT_AGENT_CALLBACK_URL }}
          PRINT_AGENT_API_KEY_SECRET: ${{ secrets.PRINT_AGENT_API_KEY }}
          ERP_AGENT_URL_SECRET: ${{ secrets.ERP_AGENT_URL }}
          ERP_AGENT_API_KEY_SECRET: ${{ secrets.ERP_AGENT_API_KEY }}
        run: |
          if ($env:PRINT_AGENT_CALLBACK_URL_SECRET -and $env:PRINT_AGENT_API_KEY_SECRET) {
            @(
              "PRINT_AGENT_CALLBACK_URL=$env:PRINT_AGENT_CALLBACK_URL_SECRET"
              "PRINT_AGENT_API_KEY=$env:PRINT_AGENT_API_KEY_SECRET"
              "POLL_INTERVAL_SECONDS=2"
              "PRINTER_PORT=9100"
              "PRINTER_TIMEOUT_SECONDS=5"
              "MAX_CONCURRENT_JOBS=3"
              "LOG_LEVEL=INFO"
              "ERP_ENABLED=false"
              "ERP_AUTH_MODE=none"
              "ERP_ENDPOINTS_JSON={}"
              "ERP_AUTH_BEARER_TOKEN="
              "ERP_AUTH_BASIC_USERNAME="
              "ERP_AUTH_BASIC_PASSWORD="
              "ERP_AUTH_STATIC_HEADERS_JSON={}"
              "ERP_DEFAULT_TIMEOUT_SECONDS=10"
              "ERP_RETRY_ATTEMPTS=0"
              "ERP_RETRY_BACKOFF_SECONDS=1"
              "ERP_TIMEOUT_MAX_SECONDS=30"
              "ERP_RETRY_MAX_ATTEMPTS=3"
              "ERP_RETRY_BACKOFF_BASE_SECONDS=1"
              "ERP_RETRY_BACKOFF_MAX_SECONDS=60"
              "ERP_RETRY_JITTER_SECONDS=1"
              "ERP_AGENT_ENABLED=false"
              "ERP_AGENT_URL=$env:ERP_AGENT_URL_SECRET"
              "ERP_AGENT_API_KEY=$env:ERP_AGENT_API_KEY_SECRET"
              "ERP_AGENT_POLL_INTERVAL_SECONDS=2"
              "ERP_AGENT_MAX_CONCURRENT_REQUESTS=2"
              "LOG_FILE=print_agent.log"
              "WORKSTATION_ID="
              "STALE_JOB_TIMEOUT_SECONDS=120"
            ) | Set-Content -Path dist\qc-print-agent\.env.example -Encoding utf8
          } else {
            Copy-Item .env.example dist\qc-print-agent\.env.example -Force
          }

      - name: Set archive name
        id: windows_archive
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "$($env:GITHUB_REF_NAME)-build-$($env:GITHUB_RUN_NUMBER)"
          }
          "archive_name=qc-print-agent-windows-$version.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path qc-print-agent -DestinationPath "${{ steps.windows_archive.outputs.archive_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows_archive.outputs.archive_name }}
          path: dist/${{ steps.windows_archive.outputs.archive_name }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ steps.windows_archive.outputs.archive_name }}
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # Remove dist folder to avoid "not empty" error
          rm -rf dist
          python3 -m PyInstaller print_agent.spec

      - name: Verify bundled Tcl/Tk files
        run: |
          echo "=== Checking dist folder structure ==="
          ls -la dist/
          echo ""
          echo "=== Checking app bundle ==="
          ls -la "dist/QC Print Agent.app/Contents/MacOS"
          echo ""
          echo "=== Checking for _internal folder ==="
          ls -la "dist/QC Print Agent.app/Contents/MacOS/_internal/" | head -20
          echo ""
          echo "=== Checking for Tcl/Tk data folders ==="
          ls "dist/QC Print Agent.app/Contents/MacOS/_internal/_tcl_data" 2>/dev/null || echo "No _tcl_data folder"
          ls "dist/QC Print Agent.app/Contents/MacOS/_internal/_tk_data" 2>/dev/null || echo "No _tk_data folder"
          echo ""
          echo "=== Build complete ==="

      - name: Generate bootstrap config template
        env:
          PRINT_AGENT_CALLBACK_URL_SECRET: ${{ secrets.PRINT_AGENT_CALLBACK_URL }}
          PRINT_AGENT_API_KEY_SECRET: ${{ secrets.PRINT_AGENT_API_KEY }}
          ERP_AGENT_URL_SECRET: ${{ secrets.ERP_AGENT_URL }}
          ERP_AGENT_API_KEY_SECRET: ${{ secrets.ERP_AGENT_API_KEY }}
        run: |
          if [ -n "$PRINT_AGENT_CALLBACK_URL_SECRET" ] && [ -n "$PRINT_AGENT_API_KEY_SECRET" ]; then
            {
              printf '%s\n' "PRINT_AGENT_CALLBACK_URL=$PRINT_AGENT_CALLBACK_URL_SECRET"
              printf '%s\n' "PRINT_AGENT_API_KEY=$PRINT_AGENT_API_KEY_SECRET"
              printf '%s\n' "POLL_INTERVAL_SECONDS=2"
              printf '%s\n' "PRINTER_PORT=9100"
              printf '%s\n' "PRINTER_TIMEOUT_SECONDS=5"
              printf '%s\n' "MAX_CONCURRENT_JOBS=3"
              printf '%s\n' "LOG_LEVEL=INFO"
              printf '%s\n' "ERP_ENABLED=false"
              printf '%s\n' "ERP_AUTH_MODE=none"
              printf '%s\n' "ERP_ENDPOINTS_JSON={}"
              printf '%s\n' "ERP_AUTH_BEARER_TOKEN="
              printf '%s\n' "ERP_AUTH_BASIC_USERNAME="
              printf '%s\n' "ERP_AUTH_BASIC_PASSWORD="
              printf '%s\n' "ERP_AUTH_STATIC_HEADERS_JSON={}"
              printf '%s\n' "ERP_DEFAULT_TIMEOUT_SECONDS=10"
              printf '%s\n' "ERP_RETRY_ATTEMPTS=0"
              printf '%s\n' "ERP_RETRY_BACKOFF_SECONDS=1"
              printf '%s\n' "ERP_TIMEOUT_MAX_SECONDS=30"
              printf '%s\n' "ERP_RETRY_MAX_ATTEMPTS=3"
              printf '%s\n' "ERP_RETRY_BACKOFF_BASE_SECONDS=1"
              printf '%s\n' "ERP_RETRY_BACKOFF_MAX_SECONDS=60"
              printf '%s\n' "ERP_RETRY_JITTER_SECONDS=1"
              printf '%s\n' "ERP_AGENT_ENABLED=false"
              printf '%s\n' "ERP_AGENT_URL=$ERP_AGENT_URL_SECRET"
              printf '%s\n' "ERP_AGENT_API_KEY=$ERP_AGENT_API_KEY_SECRET"
              printf '%s\n' "ERP_AGENT_POLL_INTERVAL_SECONDS=2"
              printf '%s\n' "ERP_AGENT_MAX_CONCURRENT_REQUESTS=2"
              printf '%s\n' "LOG_FILE=print_agent.log"
              printf '%s\n' "WORKSTATION_ID="
              printf '%s\n' "STALE_JOB_TIMEOUT_SECONDS=120"
            } > "dist/QC Print Agent.app/Contents/MacOS/.env.example"
          else
            cp .env.example "dist/QC Print Agent.app/Contents/MacOS/.env.example"
          fi

      - name: Set archive name
        id: macos_archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_REF_NAME}-build-${GITHUB_RUN_NUMBER}"
          fi
          echo "archive_name=qc-print-agent-macos-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create ZIP archive
        run: |
          cd dist
          tar -czf "${{ steps.macos_archive.outputs.archive_name }}" "QC Print Agent.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.macos_archive.outputs.archive_name }}
          path: dist/${{ steps.macos_archive.outputs.archive_name }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ steps.macos_archive.outputs.archive_name }}
          generate_release_notes: true
