name: Build Connector Installers

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - Installer-Implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # Remove dist folder to avoid "not empty" error
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          python -m PyInstaller print_agent.spec

      - name: Verify bundled Tcl/Tk files
        run: |
          echo "=== Checking dist folder structure ==="
          dir dist\qc-print-agent
          echo ""
          echo "=== Checking for _internal folder ==="
          dir dist\qc-print-agent\_internal | Select-Object -First 20
          echo ""
          echo "=== Checking for Tcl/Tk data folders ==="
          dir dist\qc-print-agent\_internal\_tcl_data 2>nul || echo "No _tcl_data folder"
          dir dist\qc-print-agent\_internal\_tk_data 2>nul || echo "No _tk_data folder"
          echo ""
          echo "=== Checking for Tcl/Tk DLLs ==="
          dir dist\qc-print-agent\_internal\tcl*.dll 2>nul || echo "No tcl DLLs"
          dir dist\qc-print-agent\_internal\tk*.dll 2>nul || echo "No tk DLLs"
          echo ""
          echo "=== Build complete ==="

      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path qc-print-agent -DestinationPath qc-print-agent-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qc-print-agent-windows
          path: dist/qc-print-agent-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/qc-print-agent-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # Remove dist folder to avoid "not empty" error
          rm -rf dist
          python3 -m PyInstaller print_agent.spec

      - name: Create ZIP for app bundle
        run: |
          cd dist
          tar -czf qc-print-agent-macos.zip QC\ Print\ Agent.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qc-print-agent-macos
          path: dist/qc-print-agent-macos.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/qc-print-agent-macos.zip
