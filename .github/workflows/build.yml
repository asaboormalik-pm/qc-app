name: Build Connector Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller print_agent.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qc-print-agent-windows
          path: dist/qc-print-agent.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/qc-print-agent.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python3 -m PyInstaller print_agent.spec --clean --windowed

      - name: Create ZIP for app bundle
        run: |
          cd dist
          zip -r "QC Print Agent.app.zip" "QC Print Agent.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qc-print-agent-macos
          path: dist/QC Print Agent.app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/QC Print Agent.app.zip
